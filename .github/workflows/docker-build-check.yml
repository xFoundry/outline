name: Docker Build Check

on:
  push:
    paths:
      - "Dockerfile"
      - "Dockerfile.base"
      - "Dockerfile.railway"
  pull_request:
    paths:
      - "Dockerfile"
      - "Dockerfile.base"
      - "Dockerfile.railway"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_IMAGE_NAME: outline-base

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The default docker driver is used (no buildx container) so the base
      # image tag is visible to the dependent main image build.
      - name: Build base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          tags: ${{ env.BASE_IMAGE_NAME }}:latest
          push: false

      - name: Build main image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE_NAME }}:latest

      # Dockerfile.railway is what production actually builds on Railway.
      - name: Build Railway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.railway
          push: false
